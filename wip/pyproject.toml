[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-toolkit"
version = "0.1.0"
description = "A comprehensive toolkit for continual learning research"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Pervasive AI Lab", email = ""},
]
keywords = [
    "continual learning",
    "lifelong learning",
    "parameter-efficient fine-tuning",
    "PEFT",
    "LoRA",
    "adapters",
    "deep learning",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "peft>=0.5.0",
    "datasets>=2.14.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "wandb>=0.15.0",
    "tensorboard>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
    "isort>=5.12.0",
]
vision = [
    "timm>=0.9.0",
    "opencv-python>=4.8.0",
]
language = [
    "sentencepiece>=0.1.99",
    "tokenizers>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/pervasive-ai-lab/continual-toolkit"
Documentation = "https://github.com/pervasive-ai-lab/continual-toolkit/docs"
Repository = "https://github.com/pervasive-ai-lab/continual-toolkit"
Issues = "https://github.com/pervasive-ai-lab/continual-toolkit/issues"

[tool.setuptools]
packages = ["ctk"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=ctk --cov-report=term-missing --cov-report=html"
